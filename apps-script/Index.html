<!DOCTYPE html>

<html lang="zh-Hant">

<head>

  <base target="_top">

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >


  <style>

    :root {

      --blue: #2563eb;

      --green: #15803d;
      --green-light: #dcfce7;

      --orange: #c2410c;
      --orange-light: #ffedd5;

      --red: #b91c1c;
      --red-light: #fee2e2;

      --gray-100: #f1f5f9;
      --gray-200: #e2e8f0;
      --gray-500: #64748b;
      --gray-700: #334155;
      --gray-900: #0f172a;

    }


    * {

      box-sizing:
        border-box;

    }


    body {

      margin:
        0;

      font-family:

        "Noto Sans TC",

        "PingFang TC",

        "Microsoft JhengHei",

        sans-serif;

      background:
        #dbe6ef;

      color:
        var(--gray-900);

    }


    button,
    input,
    select,
    textarea {

      font-family:
        inherit;

    }


    button {

      cursor:
        pointer;

    }


    .muted {

      color:
        var(--gray-500);

    }


    .good {

      color:
        var(--green);

    }


    .bad {

      color:
        var(--red);

    }


    .warning {

      color:
        var(--orange);

    }


    .done {

      color:
        var(--green);

      font-weight:
        800;

    }


    /* ======================================================
       BUTTONS
    ====================================================== */


    .btn {

      min-height:
        44px;

      border:
        1px solid
        var(--gray-200);

      border-radius:
        9px;

      padding:
        10px 16px;

      font-weight:
        700;

      background:
        white;

      color:
        var(--gray-900);

    }


    .btn:hover {

      background:
        var(--gray-100);

    }


    .btn-primary {

      background:
        var(--blue);

      color:
        white;

      border-color:
        var(--blue);

    }


    .btn-success {

      background:
        var(--green);

      color:
        white;

      border-color:
        var(--green);

    }


    .btn-danger {

      background:
        var(--red);

      color:
        white;

      border-color:
        var(--red);

    }


    .btn:disabled {

      opacity:
        0.45;

      cursor:
        not-allowed;

    }


    /* ======================================================
       LOGIN
    ====================================================== */


    .login-page {

      width:
        min(
          600px,
          92%
        );

      margin:
        60px auto;

    }


    .login-card {

      background:
        white;

      border-radius:
        20px;

      padding:
        30px;

      box-shadow:
        0 15px 40px
        rgba(
          15,
          23,
          42,
          0.15
        );

    }


    .login-card h1 {

      margin-top:
        0;

    }


    .field {

      margin-bottom:
        18px;

    }


    .field label {

      display:
        block;

      font-weight:
        700;

      margin-bottom:
        7px;

    }


    .field input,
    .field select,
    textarea {

      width:
        100%;

      padding:
        12px 14px;

      border:
        1px solid
        #cbd5e1;

      border-radius:
        10px;

      font-size:
        16px;

      background:
        white;

    }


    textarea {

      min-height:
        95px;

      resize:
        vertical;

    }


    /* ======================================================
       HUB
    ====================================================== */


    .hub {

      width:
        min(
          950px,
          94%
        );

      margin:
        30px auto;

    }


    .hub-header {

      background:
        white;

      padding:
        20px;

      border-radius:
        16px;

      margin-bottom:
        18px;

    }


    .case-grid {

      display:
        grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(
            260px,
            1fr
          )
        );

      gap:
        15px;

    }


    .case-card {

      background:
        white;

      border-radius:
        15px;

      padding:
        20px;

      border:
        1px solid
        var(--gray-200);

    }


    .case-card h3 {

      margin-top:
        5px;

    }


    /* ======================================================
       DESKTOP
    ====================================================== */


    .desktop {

      min-height:
        100vh;

      background:

        radial-gradient(
          circle at 70% 30%,
          rgba(
            255,
            255,
            255,
            0.45
          ),
          transparent 30%
        ),

        linear-gradient(
          135deg,
          #78a9c7,
          #d4e4ee 52%,
          #8fb6ca
        );

      display:
        flex;

      flex-direction:
        column;

    }


    .desktop-top {

      min-height:
        58px;

      display:
        flex;

      justify-content:
        space-between;

      align-items:
        center;

      gap:
        12px;

      padding:
        9px 18px;

      background:
        rgba(
          255,
          255,
          255,
          0.92
        );

      border-bottom:
        1px solid
        rgba(
          100,
          116,
          139,
          0.3
        );

    }


    .case-name {

      font-weight:
        800;

    }


    .system-summary {

      display:
        flex;

      gap:
        8px;

      flex-wrap:
        wrap;

      justify-content:
        flex-end;

    }


    .mini-stat {

      background:
        white;

      border:
        1px solid
        var(--gray-200);

      border-radius:
        8px;

      padding:
        5px 9px;

      font-size:
        13px;

      font-weight:
        700;

    }


    .desktop-main {

      flex:
        1;

      display:
        grid;

      grid-template-columns:
        145px 1fr;

      gap:
        15px;

      padding:
        18px;

      padding-bottom:
        75px;

    }


    /*
      Wide screen：
      Firewall Security Alert 出現時，
      幫主視窗預留右邊空間，
      避免 Alert 預設蓋住 Firewall controls。
    */
    @media (
      min-width:
        1100px
    ) {

      .desktop.security-mode
      .desktop-main {

        padding-right:
          430px;

      }

    }


    /* ======================================================
       APP ICONS
    ====================================================== */


    .desktop-icons {

      display:
        flex;

      flex-direction:
        column;

      gap:
        10px;

    }


    .app-icon {

      color:
        #102a43;

      background:
        rgba(
          255,
          255,
          255,
          0.68
        );

      border:
        1px solid
        transparent;

      border-radius:
        12px;

      padding:
        10px 6px;

      min-height:
        82px;

      text-align:
        center;

      font-size:
        12px;

    }


    .app-icon:hover {

      background:
        white;

      border-color:
        var(--blue);

    }


    .app-icon-symbol {

      display:
        block;

      font-size:
        28px;

      margin-bottom:
        5px;

    }


    /* ======================================================
       MAIN WINDOW
    ====================================================== */


    .window-area {

      display:
        flex;

      justify-content:
        center;

      align-items:
        flex-start;

      min-width:
        0;

    }


    .window {

      width:
        min(
          920px,
          100%
        );

      background:
        rgba(
          255,
          255,
          255,
          0.98
        );

      border:
        1px solid
        #9caebc;

      border-radius:
        12px;

      overflow:
        hidden;

      box-shadow:
        0 15px 35px
        rgba(
          15,
          23,
          42,
          0.18
        );

    }


    .window-titlebar {

      background:
        #eff4f7;

      border-bottom:
        1px solid
        var(--gray-200);

      display:
        flex;

      justify-content:
        space-between;

      padding:
        10px 14px;

      font-weight:
        800;

    }


    .window-content {

      padding:
        20px;

      min-height:
        430px;

      line-height:
        1.55;

    }


    /* ======================================================
       STATUS
    ====================================================== */


    .status-grid {

      display:
        grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(
            150px,
            1fr
          )
        );

      gap:
        10px;

      margin:
        15px 0;

    }


    .status-card {

      border:
        1px solid
        var(--gray-200);

      border-radius:
        10px;

      padding:
        13px;

      background:
        #fafcfd;

    }


    .status-label {

      font-size:
        13px;

      color:
        var(--gray-500);

    }


    .status-value {

      font-size:
        23px;

      font-weight:
        800;

      margin-top:
        3px;

    }


    .progress {

      height:
        9px;

      border-radius:
        99px;

      background:
        #e5e7eb;

      overflow:
        hidden;

      margin-top:
        7px;

    }


    .progress-fill {

      height:
        100%;

      background:
        var(--blue);

      transition:
        width 0.35s;

    }


    .progress-fill.bad {

      background:
        var(--red);

    }


    .progress-fill.good {

      background:
        var(--green);

    }


    /* ======================================================
       TABLE
    ====================================================== */


    table {

      width:
        100%;

      border-collapse:
        collapse;

      margin:
        15px 0;

    }


    th,
    td {

      padding:
        10px 9px;

      border-bottom:
        1px solid
        var(--gray-200);

      text-align:
        left;

    }


    th {

      background:
        var(--gray-100);

    }


    .highlight-row {

      background:
        var(--red-light);

    }


    /* ======================================================
       MESSAGES
    ====================================================== */


    .ticket {

      border-left:
        5px solid
        var(--blue);

      background:
        #f8fbff;

      padding:
        14px;

      border-radius:
        9px;

      margin-bottom:
        15px;

    }


    .result {

      margin-top:
        15px;

      border-left:
        4px solid
        var(--blue);

      background:
        #eff6ff;

      border-radius:
        8px;

      padding:
        13px;

    }


    .result.good-result {

      border-left-color:
        var(--green);

      background:
        var(--green-light);

    }


    .result.warning-result {

      border-left-color:
        var(--orange);

      background:
        var(--orange-light);

    }


    .result.danger-result {

      border-left-color:
        var(--red);

      background:
        var(--red-light);

    }


    .action-buttons {

      display:
        flex;

      flex-wrap:
        wrap;

      gap:
        9px;

      margin-top:
        15px;

    }


    /* ======================================================
       TASKBAR
    ====================================================== */


    .taskbar {

      position:
        fixed;

      left:
        0;

      right:
        0;

      bottom:
        0;

      min-height:
        52px;

      background:
        rgba(
          15,
          23,
          42,
          0.94
        );

      color:
        white;

      display:
        flex;

      align-items:
        center;

      gap:
        9px;

      padding:
        6px 12px;

      z-index:
        50;

    }


    .taskbar-spacer {

      flex:
        1;

    }


    /* ======================================================
       SUMMARY
    ====================================================== */


    .summary-screen {

      width:
        min(
          860px,
          94%
        );

      margin:
        30px auto 90px;

    }


    .summary-card {

      background:
        white;

      border-radius:
        18px;

      padding:
        24px;

      margin-bottom:
        16px;

      box-shadow:
        0 8px 20px
        rgba(
          15,
          23,
          42,
          0.08
        );

    }


    .summary-success {

      text-align:
        center;

    }


    .summary-success
    .big-icon {

      font-size:
        58px;

    }


    .timeline {

      border-left:
        3px solid
        var(--gray-200);

      padding-left:
        16px;

    }


    .timeline-item {

      margin-bottom:
        12px;

    }


    .timeline-time {

      color:
        var(--gray-500);

      font-size:
        12px;

    }


    .concept-box {

      background:
        #eef6ff;

      border:
        1px solid
        #c9ddf8;

      border-radius:
        12px;

      padding:
        16px;

    }


    /* ======================================================
       NORMAL MODAL
    ====================================================== */


    .modal {

      position:
        fixed;

      inset:
        0;

      z-index:
        100;

      background:
        rgba(
          15,
          23,
          42,
          0.55
        );

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      padding:
        20px;

    }


    .modal-card {

      width:
        min(
          520px,
          100%
        );

      background:
        white;

      padding:
        22px;

      border-radius:
        15px;

    }


    /* ======================================================
       MOVABLE FIREWALL ALERT
    ====================================================== */


    .security-alert-floating {

      position:
        fixed;

      right:
        18px;

      top:
        78px;

      z-index:
        9999;

      width:
        min(
          390px,
          calc(
            100vw - 36px
          )
        );

      background:
        white;

      border:
        3px solid
        var(--red);

      border-radius:
        14px;

      overflow:
        hidden;

      box-shadow:
        0 16px 50px
        rgba(
          0,
          0,
          0,
          0.32
        );

    }


    .security-alert-header {

      background:
        var(--red);

      color:
        white;

      padding:
        11px 14px;

      display:
        flex;

      align-items:
        center;

      gap:
        10px;

      font-weight:
        900;

      cursor:
        move;

      user-select:
        none;

      touch-action:
        none;

    }


    .security-alert-icon {

      font-size:
        24px;

    }


    .security-alert-title {

      flex:
        1;

    }


    .security-alert-lock {

      font-size:
        12px;

      background:
        rgba(
          255,
          255,
          255,
          0.18
        );

      padding:
        4px 7px;

      border-radius:
        6px;

      white-space:
        nowrap;

    }


    .security-alert-body {

      padding:
        15px;

      max-height:
        400px;

      overflow-y:
        auto;

    }


    .security-danger-title {

      color:
        var(--red);

      font-size:
        20px;

      font-weight:
        900;

      margin:
        0 0 8px;

    }


    .security-score-box {

      padding:
        11px;

      margin:
        12px 0;

      border:
        2px solid
        #fecaca;

      border-radius:
        9px;

      background:
        #fff1f2;

    }


    .security-score-number {

      color:
        var(--red);

      font-size:
        28px;

      font-weight:
        900;

    }


    .security-event-list {

      border:
        1px solid
        #fecaca;

      border-radius:
        9px;

      overflow:
        hidden;

      margin:
        11px 0;

    }


    .security-event {

      padding:
        8px 10px;

      border-bottom:
        1px solid
        #fecaca;

      background:
        #fff7f7;

      font-size:
        14px;

    }


    .security-event:last-child {

      border-bottom:
        0;

    }


    .security-alert-note {

      font-size:
        13px;

      color:
        var(--gray-700);

      background:
        var(--gray-100);

      padding:
        9px;

      border-radius:
        7px;

      margin-top:
        10px;

    }


    .security-alert-instruction {

      margin-top:
        10px;

      padding:
        10px;

      border-radius:
        8px;

      background:
        #eff6ff;

      border-left:
        4px solid
        var(--blue);

      font-weight:
        700;

    }


    /* ======================================================
       RESPONSIVE
    ====================================================== */


    @media (
      max-width:
        720px
    ) {

      .desktop-main {

        grid-template-columns:
          1fr;

      }


      .desktop-icons {

        display:
          grid;

        grid-template-columns:
          repeat(
            3,
            1fr
          );

      }


      .desktop-top {

        align-items:
          flex-start;

        flex-direction:
          column;

      }


      .system-summary {

        justify-content:
          flex-start;

      }


      .taskbar {

        flex-wrap:
          wrap;

      }


      .security-alert-floating {

        right:
          8px;

        top:
          110px;

        width:
          min(
            350px,
            calc(
              100vw - 16px
            )
          );

      }

    }

  </style>

</head>


<body>

<div id="app">
</div>


<script>


/* =========================================================
   CONFIG
========================================================= */


const MAX_LOCAL_EVENTS =
  180;


const MAX_PROGRESS_ATTEMPTS =
  4;


const MAX_SUBMIT_ATTEMPTS =
  5;


/*
  Server calls：

  Login：
  1 × getProgress()

  Playing：
  0 calls

  Case Submit：
  1 × submitCase()

  所有 actions 都只存在 browser memory。
*/


/* =========================================================
   CASE DATA
========================================================= */


const CASES = {


  /* =======================================================
     CASE 1
  ======================================================= */


  CASE01_DRIVER: {

    id:
      'CASE01_DRIVER',

    title:
      '新打印機不能正常使用',

    subtitle:
      '驅動程式（Device Driver）',

    ticket:

      `電腦室安裝了一部新打印機。
      電腦能夠偵測打印機，但無法正常列印。`,


    facts: [

      '打印機已開啟',

      'USB 線已正確連接',

      '其他電腦可以正常使用打印機'

    ],


    initialState: {

      cpu:
        22,

      memory:
        46,

      freeDisk:
        68,

      cleanupPerformed:
        false,

      firewallOn:
        true,

      securityScore:
        100,

      malware:
        0,

      virusScanned:
        false,

      printerWorking:
        false,

      driverWarning:
        true,

      driverChecked:
        false,

      meetingWorking:
        true,

      firewallChecked:
        false

    },


    correctAnswer:
      '驅動程式（Device Driver）出現兼容性問題',


    answerOptions: [

      '驅動程式（Device Driver）出現兼容性問題',

      '儲存空間不足',

      '電腦感染惡意軟件',

      '防火牆阻擋打印機'

    ],


    fixed(state) {

      return (

        state.printerWorking ===
          true &&

        state.firewallOn ===
          true

      );

    },


    summary: {

      cause:
        '打印機的驅動程式與目前的操作系統版本不完全相容。',

      evidence:
        '裝置管理員顯示打印機驅動程式出現兼容性警告。',

      concept:
        '驅動程式（Device Driver）讓操作系統與特定硬件裝置進行通訊及控制該裝置。',

      bestAction:
        '安裝／更新與操作系統相容的打印機驅動程式。'

    }

  },


  /* =======================================================
     CASE 2
  ======================================================= */


  CASE02_CPU: {

    id:
      'CASE02_CPU',

    title:
      '電腦突然非常慢',

    subtitle:
      'CPU／工作管理員（Task Manager）',

    ticket:

      `陳老師表示：
      「今朝開始部電腦突然好慢，
      開 PowerPoint 都要等好耐。」`,


    facts: [

      '昨天運作正常',

      '電腦可以正常開機',

      '網絡正常',

      '沒有錯誤訊息'

    ],


    initialState: {

      cpu:
        97,

      memory:
        54,

      freeDisk:
        18,

      cleanupPerformed:
        false,

      firewallOn:
        true,

      securityScore:
        100,

      malware:
        0,

      virusScanned:
        false,

      culpritRunning:
        true,

      printerWorking:
        true,

      driverWarning:
        false,

      meetingWorking:
        true,

      firewallChecked:
        false

    },


    correctAnswer:
      '某個程式大量使用 CPU',


    answerOptions: [

      '某個程式大量使用 CPU',

      '儲存空間不足',

      '電腦感染惡意軟件',

      '驅動程式出現問題'

    ],


    shortQuestion:
      '為甚麼磁碟清理（Disk Cleanup）不是解決這部電腦變慢的主要方法？',


    fixed(state) {

      return (

        state.cpu < 50 &&

        state.firewallOn ===
          true

      );

    },


    summary: {

      cause:
        'VideoRender.exe 大量使用 CPU，令電腦回應速度下降。',

      evidence:
        '工作管理員顯示 CPU 使用率為 97%，其中 VideoRender.exe 使用約 91%。',

      concept:
        '工作管理員（Task Manager）可以查看程式及系統資源的使用情況，例如 CPU 和記憶體。',

      bestAction:
        '確認程式不再需要，而且資料已儲存後，結束大量使用 CPU 的程式。'

    }

  },


  /* =======================================================
     CASE 3
  ======================================================= */


  CASE03_STORAGE: {

    id:
      'CASE03_STORAGE',

    title:
      '儲存空間快將用盡',

    subtitle:
      '磁碟清理（Disk Cleanup）',

    ticket:

      `圖書館的一部電腦經常顯示
      「儲存空間不足」，
      而且不能再儲存大型影片。`,


    facts: [

      '電腦可以正常開機',

      'CPU 使用情況正常',

      '沒有可疑廣告',

      '最近下載了很多影片及暫存檔案'

    ],


    initialState: {

      cpu:
        18,

      memory:
        49,

      freeDisk:
        5,

      tempFiles:
        26,

/* =========================================================
   LOGIN RETRY
========================================================= */


function loadProgressWithRetry(
  attempt
) {

  const initialDelay =

    attempt === 0

      ? Math.floor(
          Math.random() *
          4000
        )

      : retryDelay(
          attempt
        );


  const message =
    document.getElementById(
      'progressMessage'
    );


  if (message) {

    message.innerHTML =

      attempt === 0

        ? '正在讀取你的完成進度……'

        : `伺服器繁忙，正在自動重試（${attempt + 1}/${MAX_PROGRESS_ATTEMPTS}）……`;

  }


  setTimeout(

    () => {


      google.script.run

        .withSuccessHandler(

          result => {


            completedCases =
              new Set(
                result.completedCaseIds ||
                []
              );


            showHub();

          }

        )

        .withFailureHandler(

          error => {


            if (

              attempt + 1 <
                MAX_PROGRESS_ATTEMPTS

            ) {

              loadProgressWithRetry(
                attempt + 1
              );

              return;

            }


            showProgressLoadFailure(
              error
            );

          }

        )

        .getProgress(
          identity
        );


    },

    initialDelay

  );

}

/* =========================================================
   DRAG SECURITY ALERT
========================================================= */


function makeSecurityAlertDraggable() {

  const alertWindow =
    document.getElementById(
      'securityAlertWindow'
    );


  const handle =
    document.getElementById(
      'securityDragHandle'
    );


  if (

    !alertWindow ||

    !handle

  ) {

    return;

  }


  let dragging =
    false;


  let startPointerX =
    0;


  let startPointerY =
    0;


  let startLeft =
    0;


  let startTop =
    0;


  handle.addEventListener(

    'pointerdown',

    event => {


      dragging =
        true;


      const rect =
        alertWindow
          .getBoundingClientRect();


      alertWindow.style.left =
        rect.left +
        'px';


      alertWindow.style.top =
        rect.top +
        'px';


      alertWindow.style.right =
        'auto';


      startPointerX =
        event.clientX;


      startPointerY =
        event.clientY;


      startLeft =
        rect.left;


      startTop =
        rect.top;


      handle.setPointerCapture(
        event.pointerId
      );

    }

  );


  handle.addEventListener(

    'pointermove',

    event => {


      if (
        !dragging
      ) {

        return;

      }


      const deltaX =
        event.clientX -
        startPointerX;


      const deltaY =
        event.clientY -
        startPointerY;


      const rect =
        alertWindow
          .getBoundingClientRect();


      const maxLeft =
        Math.max(

          0,

          window.innerWidth -
          rect.width

        );


      const maxTop =
        Math.max(

          0,

          window.innerHeight -
          rect.height

        );


      const newLeft =
        Math.min(

          Math.max(

            0,

            startLeft +
            deltaX

          ),

          maxLeft

        );


      const newTop =
        Math.min(

          Math.max(

            0,

            startTop +
            deltaY

          ),

          maxTop

        );


      alertWindow.style.left =
        newLeft +
        'px';


      alertWindow.style.top =
        newTop +
        'px';

    }

  );


  function stopDragging(
    event
  ) {

    if (
      !dragging
    ) {

      return;

    }


    dragging =
      false;


    try {

      handle
        .releasePointerCapture(
          event.pointerId
        );

    }

    catch (error) {

      /*
        無需處理。
      */

    }

  }


  handle.addEventListener(

    'pointerup',

    stopDragging

  );


  handle.addEventListener(

    'pointercancel',

    stopDragging

  );

}


/* =========================================================
   PERFORM ACTION
========================================================= */


function performAction(
  actionName,
  changeFunction,
  options = {}
) {

  const undoable =
    options.undoable !==
      false;


  if (
    undoable
  ) {

    undoStack.push({

      state:
        deepClone(
          state
        ),

      lastApp:
        lastApp,

      lastMessage:
        lastMessage,

      actionName:
        actionName

    });

  }


  changeFunction();


  actionCount++;


  /*
    全部只存在 browser。
  */
  recordEvent(

    'ACTION',

    actionName,

    '',

    {
      state:
        stateSummary()
    }

  );


  if (

    state.firewallOn &&

    currentCase.fixed(
      state
    )

  ) {

    recordEvent(

      'CASE_FIXED',

      '成功修復個案',

      actionName,

      {
        state:
          stateSummary()
      }

    );


    setTimeout(

      showSummary,

      300

    );


    return;

  }


  showDesktop();

}


/* =========================================================
   UNDO
========================================================= */


function undoLastAction() {

  /*
    Firewall Off 時不能用 Undo
    繞過 Security Alert。

    必須真的在 Firewall app
    重新開啟 Firewall。
  */
  if (

    !state.firewallOn ||

    undoStack.length ===
      0

  ) {

    return;

  }


  const snapshot =
    undoStack.pop();


  state =
    deepClone(
      snapshot.state
    );


  lastApp =
    snapshot.lastApp;


  lastMessage =

    `已復原：
    ${snapshot.actionName}`;


  undoCount++;


  /*
    重要：
    新版不會刪除被 Undo 的舊 action。

    老師仍然看得到：
    關過甚麼、試過甚麼、然後 Undo。
  */
  recordEvent(

    'UNDO',

    '復原上一個操作',

    snapshot.actionName,

    {
      state:
        stateSummary()
    }

  );


  pendingSubmissionPayload =
    null;


  submissionInFlight =
    false;


  showDesktop();

}

/* =========================================================
   SUBMIT CASE
========================================================= */


function submitCase() {

  if (
    submissionInFlight
  ) {

    return;

  }


  const button =
    document.getElementById(
      'submitCaseBtn'
    );


  const message =
    document.getElementById(
      'submitMessage'
    );


  /*
    如果上一次 submit 全部 retry 都失敗，
    pendingSubmissionPayload 仍然保留。

    再按「重新提交」會使用同一 Submission_ID，
    防止 duplicate。
  */
  if (
    !pendingSubmissionPayload
  ) {


    const finalAnswer =
      document
        .getElementById(
          'finalAnswer'
        )
        .value;


    const confidence =
      document
        .getElementById(
          'confidence'
        )
        .value;


    const shortAnswerElement =
      document
        .getElementById(
          'shortAnswer'
        );


    const shortAnswer =

      shortAnswerElement

        ? shortAnswerElement
            .value
            .trim()

        : '';


    if (

      !finalAnswer ||

      !confidence

    ) {

      message.innerHTML = `

        <div class="result danger-result">

          請完成個人答案及信心程度。

        </div>

      `;

      return;

    }


    if (

      currentCase.shortQuestion &&

      !shortAnswer

    ) {

      message.innerHTML = `

        <div class="result danger-result">

          請完成短答題。

        </div>

      `;

      return;

    }


    recordEvent(

      'SUBMIT',

      '提交個人答案',

      finalAnswer,

      {
        confidence:
          confidence
      }

    );


    const elapsed =
      Math.round(

        (
          Date.now() -
          caseStartTime
        ) /

        1000

      );


    const submissionId =
      [

        sessionId,

        currentCase.id,

        Date.now(),

        Math
          .random()
          .toString(36)
          .slice(
            2,
            9
          )

      ].join('-');


    /*
      整個 Case 的資料，
      一次過送到 server。
    */
    pendingSubmissionPayload = {

      ...identity,


      session_id:
        sessionId,


      submission_id:
        submissionId,


      client_submitted_at:
        new Date()
          .toISOString(),


      case_id:
        currentCase.id,


      final_answer:
        finalAnswer,


      short_answer:
        shortAnswer,


      confidence:
        confidence,


      was_fixed:
        currentCase.fixed(
          state
        ),


      action_count:
        actionCount,


      undo_count:
        undoCount,


      elapsed_seconds:
        elapsed,


      action_history:
        actionHistory,


      security_incident_ever:
        securityIncidentEver,


      security_incident_count:
        securityIncidentCount,


      final_security_score:
        state.securityScore

    };

  }


  submissionInFlight =
    true;


  button.disabled =
    true;


  button.textContent =
    '正在提交……';


  sendSubmissionWithRetry(

    pendingSubmissionPayload,

    0

  );

}


/* =========================================================
   SUBMISSION RETRY
========================================================= */


function sendSubmissionWithRetry(
  payload,
  attempt
) {

  const message =
    document.getElementById(
      'submitMessage'
    );


  const button =
    document.getElementById(
      'submitCaseBtn'
    );


  /*
    第一次 submit：
    0–2.5 秒 random jitter。

    33 人同時完成時，
    不會完全同一毫秒 hit Apps Script。
  */
  const delay =

    attempt === 0

      ? Math.floor(
          Math.random() *
          8000
        )

      : retryDelay(
          attempt
        );


  if (
    message
  ) {

    message.innerHTML = `

      <div class="result">

        ${
          attempt === 0

            ? '正在排隊提交資料……'

            : `伺服器繁忙，正在自動重試（${attempt + 1}/${MAX_SUBMIT_ATTEMPTS}）……`
        }

        <br><br>

        請不要關閉此頁面。

      </div>

    `;

  }


  setTimeout(

    () => {


      google.script.run

        .withSuccessHandler(

          result => {


            submissionInFlight =
              false;


            pendingSubmissionPayload =
              null;


            completedCases.add(
              currentCase.id
            );


            showSubmitted(
              result.finalCorrect
            );

          }

        )

        .withFailureHandler(

          error => {


            if (

              attempt + 1 <
                MAX_SUBMIT_ATTEMPTS

            ) {

              sendSubmissionWithRetry(

                payload,

                attempt + 1

              );


              return;

            }


            submissionInFlight =
              false;


            if (
              button
            ) {

              button.disabled =
                false;


              button.textContent =
                '重新提交';

            }


            if (
              message
            ) {

              message.innerHTML = `

                <div class="result danger-result">

                  暫時未能提交資料。

                  <br><br>

                  系統已保留今次 Submission ID，
                  你可以按「重新提交」，
                  不會重複寫入同一份紀錄。

                  <br><br>

                  ${escapeHtml(
                    errorText(
                      error
                    )
                  )}

                </div>

              `;

            }

          }

        )

        .submitCase(
          payload
        );


    },

    delay

  );

}


/* =========================================================
   RETRY DELAY
========================================================= */


function retryDelay(
  attempt
) {

  const exponential =
    1200 *
    Math.pow(
      2,
      Math.max(
        0,
        attempt - 1
      )
    );


  const jitter =
    Math.floor(
      Math.random() *
      1000
    );


  return Math.min(

    exponential +
    jitter,

    10000

  );

}

/* =========================================================
   LOCAL EVENT BUFFER
========================================================= */


/*
  全部 action logging
  現在只寫 browser memory。

  不會 call server。
*/
function recordEvent(
  eventType,
  action,
  value = '',
  details = {}
) {

  if (

    actionHistory.length >=
      MAX_LOCAL_EVENTS

  ) {

    return;

  }


  eventCounter++;


  const now =
    new Date();


  actionHistory.push({

    event_index:
      eventCounter,

    client_time:
      now.toISOString(),

    display_time:
      now.toLocaleTimeString(

        'zh-HK',

        {

          hour:
            '2-digit',

          minute:
            '2-digit',

          second:
            '2-digit'

        }

      ),

    event_type:
      eventType,

    action:
      action,

    value:
      value,

    details:
      details

  });

}

/* =========================================================
   UTILITY
========================================================= */


function deepClone(
  value
) {

  return JSON.parse(
    JSON.stringify(
      value
    )
  );

}


function escapeHtml(
  value
) {

  return String(
    value
  )

    .replaceAll(
      '&',
      '&amp;'
    )

    .replaceAll(
      '<',
      '&lt;'
    )

    .replaceAll(
      '>',
      '&gt;'
    )

    .replaceAll(
      '"',
      '&quot;'
    )

    .replaceAll(
      "'",
      '&#039;'
    );

}


function errorText(
  error
) {

  if (
    error &&
    error.message
  ) {

    return error.message;

  }


  return String(
    error ||
    '未知錯誤'
  );

}
